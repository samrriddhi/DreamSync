<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DreamSync Private WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
<h2>DreamSync Private WebSocket Test</h2>
<label for="token">Access token (JWT)</label>
<input type="password" id="token" autocomplete="off" placeholder="Paste access token">
<button id="connectBtn" onclick="connect()">Connect</button>
<p id="status">Not connected</p>
<hr>
<h3>My notifications</h3>
<div id="messages"></div>

<script>
    let stompClient = null;

    function connect() {
        const token = document.getElementById("token").value.trim();
        if (!token) {
            document.getElementById("status").textContent = "Enter an access token first.";
            return;
        }

        const socket = new SockJS("/ws");
        stompClient = new StompJs.Client({
            webSocketFactory: () => socket,
            connectHeaders: {
                Authorization: "Bearer " + token
            },
            onConnect: () => {
                document.getElementById("status").textContent = "Connected";
                document.getElementById("connectBtn").disabled = true;
                stompClient.subscribe("/user/queue/notifications", (frame) => {
                    const notification = JSON.parse(frame.body);
                    const item = document.createElement("p");
                    item.textContent = notification.sender + ": " + notification.message;
                    document.getElementById("messages").appendChild(item);
                });
            },
            onStompError: () => {
                document.getElementById("status").textContent = "Connection error. Check your token.";
            },
            onWebSocketClose: () => {
                document.getElementById("status").textContent = "Disconnected";
                document.getElementById("connectBtn").disabled = false;
            }
        });
        stompClient.activate();
    }
</script>
</body>
</html>
