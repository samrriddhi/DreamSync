spring.application.name=dreamsync

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dreamsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
