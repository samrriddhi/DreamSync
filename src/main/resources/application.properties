spring.application.name=dreamsync

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dreamsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Comma-separated browser origins allowed to call the REST API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
